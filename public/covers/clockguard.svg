<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#240c0c"/><stop offset="1" stop-color="#0c0707"/>
    </linearGradient>
    <radialGradient id="glow" cx="56%" cy="46%" r="55%">
      <stop offset="0" stop-color="#f87171" stop-opacity="0.2"/><stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- two unrelated clocks drifting past each other -->
  <g stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M60 116 H96 V82 H156 V116 H216 V82 H276 V116 H336 V82 H396 V116 H456 V82 H516 V116 H576 V82 H636 V116 H696 V82 H740" stroke="#fca5a5" stroke-opacity="0.8"/>
    <path d="M60 176 H120 V142 H164 V176 H208 V142 H252 V176 H296 V142 H340 V176 H384 V142 H428 V176 H472 V142 H516 V176 H560 V142 H604 V176 H648 V142 H692 V176 H740" stroke="#f87171" stroke-opacity="0.65"/>
  </g>

  <!-- the hazard: edges that land too close together -->
  <g filter="url(#soft)">
    <path d="M384 62 V398" stroke="#f87171" stroke-width="2" stroke-dasharray="7 6"/>
    <circle cx="384" cy="142" r="9" fill="#f87171"/>
  </g>

  <!-- domain A -> two-flop synchronizer in domain B -->
  <rect x="60" y="232" width="214" height="150" rx="16" fill="#1d0c0c" stroke="#fca5a5" stroke-opacity="0.4" stroke-width="1.6" stroke-dasharray="6 5"/>
  <rect x="300" y="232" width="440" height="150" rx="16" fill="#1d0c0c" stroke="#f87171" stroke-opacity="0.5" stroke-width="1.6" stroke-dasharray="6 5"/>
  <g fill="#2a0f0f" stroke-width="2.2">
    <rect x="132" y="280" width="70" height="56" rx="8" stroke="#fca5a5"/>
    <rect x="372" y="280" width="70" height="56" rx="8" stroke="#f87171"/>
    <rect x="490" y="280" width="70" height="56" rx="8" stroke="#f87171"/>
    <rect x="608" y="280" width="70" height="56" rx="8" stroke="#fecaca"/>
  </g>
  <g stroke-width="2.2" stroke-linecap="round">
    <path d="M202 308 H372" stroke="#fca5a5" stroke-opacity="0.85"/>
    <path d="M442 308 H490" stroke="#f87171"/>
    <path d="M560 308 H608" stroke="#fecaca"/>
    <path d="M678 308 H716" stroke="#fecaca" stroke-opacity="0.7"/>
  </g>
  <g fill="#f87171"><path d="M368 302 L376 308 L368 314 Z"/><path d="M486 302 L494 308 L486 314 Z"/></g>
  <g fill="#fecaca"><path d="M604 302 L612 308 L604 314 Z"/></g>
  <!-- the wobble in the first stage -->
  <path d="M384 308 q6 -10 12 0 t12 0 t12 0 t12 0" stroke="#fecaca" stroke-width="1.8" opacity="0.9"/>
  <!-- the settled value in the second stage -->
  <path d="M502 314 H548" stroke="#fecaca" stroke-width="2.4" stroke-linecap="round"/>
  <!-- a check mark on the clean output -->
  <path d="M630 308 L640 318 L656 298" stroke="#fecaca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ambient -->
  <g fill="#fecaca" opacity="0.55">
    <circle cx="720" cy="60" r="2"/><circle cx="84" cy="410" r="1.8"/><circle cx="560" cy="414" r="2.2"/><circle cx="250" cy="62" r="1.8"/>
  </g>
</svg>
