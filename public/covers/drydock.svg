<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a26"/><stop offset="1" stop-color="#04080c"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="52%" r="55%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- the fleet: one tile per agent, most verified, some running, one rejected -->
  <g transform="translate(64 78)">
    <g fill="#34d399" opacity="0.8">
      <rect x="0" y="0" width="22" height="22" rx="5"/><rect x="30" y="0" width="22" height="22" rx="5"/><rect x="90" y="0" width="22" height="22" rx="5"/>
      <rect x="0" y="30" width="22" height="22" rx="5"/><rect x="60" y="30" width="22" height="22" rx="5"/><rect x="90" y="30" width="22" height="22" rx="5"/>
      <rect x="30" y="60" width="22" height="22" rx="5"/><rect x="60" y="60" width="22" height="22" rx="5"/><rect x="0" y="90" width="22" height="22" rx="5"/>
      <rect x="90" y="90" width="22" height="22" rx="5"/><rect x="30" y="120" width="22" height="22" rx="5"/><rect x="60" y="120" width="22" height="22" rx="5"/>
    </g>
    <g fill="#38bdf8">
      <rect x="60" y="0" width="22" height="22" rx="5"/><rect x="30" y="30" width="22" height="22" rx="5"/><rect x="0" y="60" width="22" height="22" rx="5"/>
      <rect x="30" y="90" width="22" height="22" rx="5"/><rect x="0" y="120" width="22" height="22" rx="5"/><rect x="90" y="120" width="22" height="22" rx="5"/>
    </g>
    <rect x="90" y="60" width="22" height="22" rx="5" fill="#f87171"/>
    <rect x="60" y="90" width="22" height="22" rx="5" fill="#38bdf8" opacity="0.45"/>
  </g>

  <!-- one sandbox: a sealed box, a terminal inside, a padlock on the edge -->
  <g filter="url(#soft)">
    <rect x="262" y="96" width="250" height="196" rx="16" stroke="#38bdf8" stroke-width="2.5" fill="#0a2333"/>
  </g>
  <path d="M262 126h250" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <g fill="#38bdf8" opacity="0.6"><circle cx="280" cy="111" r="3.5"/><circle cx="294" cy="111" r="3.5"/><circle cx="308" cy="111" r="3.5"/></g>
  <g stroke-linecap="round" stroke-width="5">
    <path d="M284 152h14" stroke="#7dd3fc"/><path d="M308 152h120" stroke="#7dd3fc" opacity="0.55"/>
    <path d="M284 176h176" stroke="#cbd5e1" opacity="0.35"/>
    <path d="M284 200h132" stroke="#cbd5e1" opacity="0.35"/>
    <path d="M284 224h14" stroke="#7dd3fc"/><path d="M308 224h82" stroke="#7dd3fc" opacity="0.55"/>
    <path d="M284 248h60" stroke="#34d399" opacity="0.8"/>
  </g>
  <g transform="translate(494 262)">
    <rect x="0" y="12" width="36" height="30" rx="6" fill="#071a26" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M7 12V5a11 11 0 0 1 22 0v7" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="18" cy="27" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- the patch leaves the sandbox, nothing else does -->
  <path d="M520 194h76" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="m590 186 10 8-10 8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the second, clean sandbox: the hidden tests decide -->
  <rect x="610" y="138" width="128" height="112" rx="14" stroke="#34d399" stroke-width="2.5"/>
  <g stroke-linecap="round" stroke-width="4">
    <path d="M630 164h36" stroke="#34d399" opacity="0.7"/><path d="M630 184h56" stroke="#f87171" opacity="0.7"/><path d="M630 184h22" stroke="#34d399"/>
  </g>
  <path d="m648 216 14 14 28-30" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>

  <!-- the dock: a keel line under both boxes -->
  <path d="M248 334c120 26 380 26 504 0" stroke="#38bdf8" stroke-width="2" opacity="0.35"/>
  <path d="M300 334v26M400 342v26M500 344v26M600 340v26M700 334v26" stroke="#38bdf8" stroke-width="2" opacity="0.25"/>

  <!-- ambient points -->
  <g fill="#bae6fd" opacity="0.5">
    <circle cx="560" cy="70" r="2"/><circle cx="740" cy="96" r="2.2"/><circle cx="200" cy="380" r="2"/><circle cx="720" cy="410" r="1.8"/><circle cx="330" cy="60" r="2.4"/>
  </g>
</svg>
