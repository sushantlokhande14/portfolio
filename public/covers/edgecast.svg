<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2329"/><stop offset="1" stop-color="#05090c"/>
    </linearGradient>
    <radialGradient id="glow" cx="42%" cy="50%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.24"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- publisher -> origin -> four edges -->
  <g stroke="#22d3ee" stroke-width="2" opacity="0.55" stroke-linecap="round">
    <path d="M190 225 H262"/>
    <path d="M338 210 C410 180 430 120 484 112"/>
    <path d="M338 220 C410 210 440 190 484 188"/>
    <path d="M338 230 C410 240 440 262 484 264"/>
  </g>
  <!-- the impaired last edge: a broken, dashed link -->
  <path d="M338 240 C410 270 430 330 484 340" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3 9" opacity="0.45" stroke-linecap="round"/>

  <!-- groups in flight -->
  <g fill="#a5f3fc">
    <rect x="216" y="219" width="12" height="12" rx="3"/>
    <rect x="236" y="219" width="12" height="12" rx="3" opacity="0.6"/>
    <rect x="422" y="141" width="10" height="10" rx="2.5"/>
    <rect x="430" y="196" width="10" height="10" rx="2.5"/>
    <rect x="430" y="248" width="10" height="10" rx="2.5" opacity="0.7"/>
  </g>

  <!-- publisher -->
  <rect x="96" y="181" width="94" height="88" rx="20" fill="#0f2f37" stroke="#22d3ee" stroke-width="2.5"/>
  <path d="M132 206 L162 225 L132 244 Z" fill="#67e8f9"/>

  <!-- origin relay -->
  <g filter="url(#soft)">
    <rect x="262" y="187" width="76" height="76" rx="22" fill="#103842" stroke="#67e8f9" stroke-width="2.5"/>
    <circle cx="300" cy="225" r="12" fill="#a5f3fc"/>
  </g>

  <!-- edge relays -->
  <g fill="#0f2f37" stroke="#22d3ee" stroke-width="2">
    <circle cx="508" cy="112" r="24"/>
    <circle cx="508" cy="188" r="24"/>
    <circle cx="508" cy="264" r="24"/>
    <circle cx="508" cy="340" r="24" opacity="0.6"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="508" cy="112" r="7"/><circle cx="508" cy="188" r="7"/><circle cx="508" cy="264" r="7"/>
    <circle cx="508" cy="340" r="7" opacity="0.5"/>
  </g>

  <!-- viewers fanning out of each edge -->
  <g stroke="#22d3ee" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <path d="M532 112 L640 82"/><path d="M532 112 L652 112"/><path d="M532 112 L640 142"/>
    <path d="M532 188 L640 166"/><path d="M532 188 L656 196"/><path d="M532 188 L640 222"/>
    <path d="M532 264 L644 246"/><path d="M532 264 L652 278"/><path d="M532 264 L640 304"/>
  </g>
  <g fill="#a5f3fc">
    <circle cx="646" cy="80" r="6"/><circle cx="660" cy="112" r="6"/><circle cx="646" cy="144" r="6"/>
    <circle cx="646" cy="164" r="6"/><circle cx="664" cy="196" r="6"/><circle cx="646" cy="224" r="6"/>
    <circle cx="650" cy="244" r="6"/><circle cx="660" cy="278" r="6"/><circle cx="646" cy="306" r="6"/>
  </g>
  <g fill="#67e8f9" opacity="0.35">
    <circle cx="640" cy="330" r="6"/><circle cx="656" cy="352" r="6"/><circle cx="640" cy="372" r="6"/>
  </g>

  <!-- ambient points -->
  <g fill="#a5f3fc" opacity="0.5">
    <circle cx="210" cy="96" r="2"/><circle cx="380" cy="70" r="2.5"/><circle cx="744" cy="380" r="2"/><circle cx="150" cy="372" r="1.8"/><circle cx="740" cy="90" r="2"/>
  </g>
</svg>
