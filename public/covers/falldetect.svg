  <!-- ambient points -->
  <g fill="#d9f99d" opacity="0.45">
    <circle cx="640" cy="90" r="2"/><circle cx="730" cy="140" r="2.5"/><circle cx="200" cy="80" r="2"/><circle cx="560" cy="250" r="1.8"/>
