<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a240a"/><stop offset="1" stop-color="#070905"/>
    </linearGradient>
    <radialGradient id="glow" cx="52%" cy="40%" r="55%">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.2"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- accelerometer magnitude: walking, the fall, then lying still -->
  <path d="M60 196 q12 -18 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 l10 44 l12 -150 l12 196 l12 -112 l12 52 l12 -20 l10 8 h40 q8 -3 16 0 h200"
        stroke="#bef264" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#soft)"/>
  <!-- the window the model flags -->
  <rect x="380" y="70" width="104" height="200" rx="12" stroke="#a3e635" stroke-width="2" stroke-dasharray="5 6" opacity="0.7"/>
  <rect x="380" y="70" width="104" height="200" rx="12" fill="#a3e635" opacity="0.06"/>

  <!-- the same signal as a spectrogram, brightest at the impact -->
