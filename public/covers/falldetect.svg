      <rect x="78" y="0" width="22" height="18" rx="3" opacity="0.16"/><rect x="78" y="22" width="22" height="18" rx="3" opacity="0.34"/><rect x="78" y="44" width="22" height="18" rx="3" opacity="0.2"/><rect x="78" y="66" width="22" height="18" rx="3" opacity="0.1"/>
      <rect x="104" y="0" width="22" height="18" rx="3" opacity="0.18"/><rect x="104" y="22" width="22" height="18" rx="3" opacity="0.3"/><rect x="104" y="44" width="22" height="18" rx="3" opacity="0.22"/><rect x="104" y="66" width="22" height="18" rx="3" opacity="0.12"/>
      <rect x="130" y="0" width="22" height="18" rx="3" opacity="0.14"/><rect x="130" y="22" width="22" height="18" rx="3" opacity="0.32"/><rect x="130" y="44" width="22" height="18" rx="3" opacity="0.2"/><rect x="130" y="66" width="22" height="18" rx="3" opacity="0.1"/>
      <rect x="156" y="0" width="22" height="18" rx="3" opacity="0.2"/><rect x="156" y="22" width="22" height="18" rx="3" opacity="0.3"/><rect x="156" y="44" width="22" height="18" rx="3" opacity="0.24"/><rect x="156" y="66" width="22" height="18" rx="3" opacity="0.12"/>
