<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2420"/><stop offset="1" stop-color="#05090a"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="48%" r="55%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.22"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- the road: two edges and a dashed centre line, sweeping right -->
  <g stroke="#34d399" stroke-width="2" opacity="0.35" stroke-linecap="round">
    <path d="M40 360 C220 360 300 210 470 190 S700 150 770 150"/>
    <path d="M40 430 C240 430 330 280 490 262 S710 226 770 226"/>
  </g>
  <path d="M40 395 C230 395 315 245 480 226 S705 188 770 188" stroke="#34d399" stroke-width="1.5" stroke-dasharray="10 12" opacity="0.25"/>

  <!-- baseline: holds the lane -->
  <path d="M90 395 C250 395 322 246 482 227 S690 190 740 189" stroke="#6ee7b7" stroke-width="3.5" stroke-linecap="round" filter="url(#soft)"/>
  <!-- candidate: drifts out after the divergence point -->
  <path d="M90 401 C250 401 322 252 470 232 C560 222 610 250 690 276" stroke="#fda4af" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>

  <!-- first point of divergence -->
  <circle cx="474" cy="230" r="16" stroke="#fda4af" stroke-width="2" opacity="0.8"/>
  <circle cx="474" cy="230" r="5" fill="#fda4af"/>

  <!-- the two cars at the end of their runs -->
  <rect x="728" y="178" width="32" height="20" rx="6" fill="#6ee7b7" transform="rotate(-6 744 188)"/>
  <rect x="680" y="268" width="32" height="20" rx="6" fill="#fda4af" transform="rotate(20 696 278)"/>

  <!-- campaign tiles: scenarios that passed and the cluster that failed -->
  <g transform="translate(80 70)">
    <g fill="#34d399">
      <rect x="0" y="0" width="16" height="16" rx="4" opacity="0.8"/><rect x="22" y="0" width="16" height="16" rx="4" opacity="0.8"/>
      <rect x="44" y="0" width="16" height="16" rx="4" opacity="0.8"/><rect x="66" y="0" width="16" height="16" rx="4" opacity="0.8"/>
      <rect x="0" y="22" width="16" height="16" rx="4" opacity="0.8"/><rect x="22" y="22" width="16" height="16" rx="4" opacity="0.8"/>
      <rect x="66" y="22" width="16" height="16" rx="4" opacity="0.8"/><rect x="88" y="0" width="16" height="16" rx="4" opacity="0.8"/>
      <rect x="0" y="44" width="16" height="16" rx="4" opacity="0.8"/><rect x="44" y="44" width="16" height="16" rx="4" opacity="0.8"/>
      <rect x="66" y="44" width="16" height="16" rx="4" opacity="0.8"/><rect x="88" y="44" width="16" height="16" rx="4" opacity="0.8"/>
    </g>
    <g fill="#fda4af">
      <rect x="44" y="22" width="16" height="16" rx="4"/><rect x="88" y="22" width="16" height="16" rx="4"/><rect x="22" y="44" width="16" height="16" rx="4"/>
    </g>
  </g>

  <!-- ambient points -->
  <g fill="#a7f3d0" opacity="0.5">
    <circle cx="420" cy="80" r="2"/><circle cx="620" cy="70" r="2.5"/><circle cx="748" cy="360" r="2"/><circle cx="300" cy="140" r="1.8"/><circle cx="580" cy="390" r="2"/>
  </g>
</svg>
