<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/><stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#5e9eff" stop-opacity="0.2"/><stop offset="1" stop-color="#5e9eff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- three stacked layer planes, sparse on top, dense at the bottom -->
  <g stroke="#5e9eff" stroke-opacity="0.3" stroke-width="1.5" fill="#5e9eff" fill-opacity="0.04">
    <path d="M330 60 L610 60 L530 150 L250 150 Z"/>
    <path d="M290 165 L570 165 L490 255 L210 255 Z"/>
    <path d="M250 270 L530 270 L450 360 L170 360 Z"/>
  </g>

  <!-- layer 2: sparse, a couple of nodes and one long edge -->
  <g stroke="#5e9eff" stroke-width="1.6" opacity="0.6">
    <path d="M392 122 L520 84"/>
  </g>
  <g fill="#5e9eff">
    <circle cx="392" cy="122" r="5"/><circle cx="520" cy="84" r="5"/>
  </g>

  <!-- layer 1: middling density -->
  <g stroke="#5e9eff" stroke-width="1.4" opacity="0.45">
    <path d="M352 227 L300 196"/><path d="M352 227 L430 210"/>
    <path d="M430 210 L496 186"/><path d="M300 196 L378 180"/>
  </g>
  <g fill="#5e9eff" opacity="0.85">
    <circle cx="300" cy="196" r="4"/><circle cx="430" cy="210" r="4"/>
    <circle cx="496" cy="186" r="4"/><circle cx="378" cy="180" r="4"/>
  </g>
  <circle cx="352" cy="227" r="5.5" fill="#7ee787"/>

  <!-- layer 0: every point lives here, in clusters -->
  <g fill="#9bb6e0" opacity="0.55">
    <circle cx="238" cy="330" r="2.6"/><circle cx="256" cy="318" r="2.6"/><circle cx="228" cy="312" r="2.6"/>
    <circle cx="266" cy="336" r="2.6"/><circle cx="248" cy="344" r="2.6"/><circle cx="276" cy="308" r="2.6"/>
    <circle cx="452" cy="300" r="2.6"/><circle cx="470" cy="312" r="2.6"/><circle cx="440" cy="316" r="2.6"/>
    <circle cx="486" cy="296" r="2.6"/><circle cx="462" cy="288" r="2.6"/>
    <circle cx="352" cy="352" r="2.6"/><circle cx="368" cy="342" r="2.6"/><circle cx="336" cy="344" r="2.6"/>
    <circle cx="212" cy="348" r="2.6"/><circle cx="500" cy="322" r="2.6"/><circle cx="410" cy="286" r="2.6"/>
  </g>
  <!-- the local neighborhood the search settles into -->
  <g stroke="#5e9eff" stroke-width="1.3" opacity="0.55">
    <path d="M330 318 L300 302"/><path d="M330 318 L360 306"/><path d="M330 318 L312 336"/>
    <path d="M360 306 L392 296"/>
  </g>
  <g fill="#ffd479">
    <circle cx="300" cy="302" r="4.5"/><circle cx="360" cy="306" r="4.5"/><circle cx="312" cy="336" r="4.5"/>
  </g>
  <circle cx="330" cy="318" r="6.5" fill="#ffffff" filter="url(#soft)"/>

  <!-- the descent: the query falling from the top layer to the answer -->
  <g stroke="#ff7b72" stroke-width="2" stroke-dasharray="5 6" opacity="0.85">
    <path d="M392 122 L352 227"/>
    <path d="M352 227 L330 318"/>
  </g>
  <circle cx="392" cy="122" r="11" stroke="#ff7b72" stroke-width="1.8" fill="none" opacity="0.7"/>

  <!-- layer labels -->
  <g fill="#8b949e" font-family="ui-monospace, Menlo, monospace" font-size="12" opacity="0.8">
    <text x="628" y="106">layer 2</text>
    <text x="588" y="211">layer 1</text>
    <text x="548" y="316">layer 0</text>
  </g>
</svg>
