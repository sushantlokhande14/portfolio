<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1609"/><stop offset="1" stop-color="#0b0705"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.24"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- client -> gate -> servers -->
  <g stroke="#fb923c" stroke-width="2" opacity="0.5" stroke-linecap="round">
    <path d="M206 225 H320"/>
    <path d="M480 200 L590 126"/>
    <path d="M480 225 H590"/>
    <path d="M480 250 L590 324"/>
  </g>
  <!-- a returning result, with a credential redacted on the way back -->
  <g>
    <rect x="236" y="246" width="54" height="12" rx="3" fill="#fdba74"/>
    <rect x="236" y="246" width="54" height="12" rx="3" fill="#0b0705" opacity="0.55"/>
    <g fill="#fed7aa" opacity="0.8"><rect x="526" y="214" width="10" height="10" rx="2.5"/><rect x="544" y="214" width="10" height="10" rx="2.5" opacity="0.6"/></g>
  </g>

  <!-- client -->
  <rect x="92" y="172" width="114" height="106" rx="22" fill="#331b0b" stroke="#fb923c" stroke-width="2.5"/>
  <g fill="#fdba74" opacity="0.85">
    <rect x="114" y="200" width="70" height="8" rx="4"/>
    <rect x="114" y="218" width="52" height="8" rx="4"/>
    <rect x="114" y="236" width="62" height="8" rx="4" opacity="0.6"/>
  </g>

  <!-- the gate: an arched frame with a lowered grille -->
  <path d="M320 344 V170 A80 80 0 0 1 480 170 V344" stroke="#fb923c" stroke-width="3" fill="#24130a"/>
  <g stroke="#fdba74" stroke-width="3" stroke-linecap="round" filter="url(#soft)">
    <path d="M346 132 V300 l-6 14"/><path d="M372 110 V300 l-6 14"/><path d="M400 102 V300 l-6 14"/>
    <path d="M428 110 V300 l-6 14"/><path d="M454 132 V300 l-6 14"/>
  </g>
  <g stroke="#fb923c" stroke-width="2.5" opacity="0.85">
    <path d="M326 180 H474"/><path d="M322 240 H478"/>
  </g>

  <!-- a refused call -->
  <g stroke="#fecaca" stroke-width="3" stroke-linecap="round">
    <path d="M552 358 l16 16"/><path d="M568 358 l-16 16"/>
  </g>
  <path d="M480 300 L548 360" stroke="#fb923c" stroke-width="2" stroke-dasharray="3 7" opacity="0.5" stroke-linecap="round"/>

  <!-- upstream servers -->
  <g fill="#331b0b" stroke="#fb923c" stroke-width="2">
    <rect x="590" y="96" width="122" height="60" rx="14"/>
    <rect x="590" y="195" width="122" height="60" rx="14"/>
    <rect x="590" y="294" width="122" height="60" rx="14"/>
  </g>
  <g fill="#fdba74">
    <circle cx="614" cy="126" r="6"/><rect x="630" y="122" width="58" height="8" rx="4" opacity="0.7"/>
    <circle cx="614" cy="225" r="6"/><rect x="630" y="221" width="46" height="8" rx="4" opacity="0.7"/>
    <circle cx="614" cy="324" r="6"/><rect x="630" y="320" width="64" height="8" rx="4" opacity="0.7"/>
  </g>

  <!-- ambient points -->
  <g fill="#fed7aa" opacity="0.5">
    <circle cx="200" cy="96" r="2"/><circle cx="540" cy="60" r="2.5"/><circle cx="748" cy="400" r="2"/><circle cx="150" cy="370" r="1.8"/><circle cx="260" cy="330" r="2"/>
  </g>
</svg>
